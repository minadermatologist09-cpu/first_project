<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Нэвтрэх · SKINOLOGY CLINIC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    .login-screen { min-height: 100vh; display: grid; place-items: center; padding: 40px 18px;
      background: radial-gradient(60% 60% at 80% 10%, rgba(198,161,91,.20), transparent 70%), var(--bg); }
    .login-card { width: 100%; max-width: 380px; background: var(--white); border: 1px solid var(--line);
      border-radius: var(--radius); padding: 40px; box-shadow: var(--shadow); }
    .login-card h1 { font-size: 22px; margin: 18px 0 22px; }
  </style>
</head>
<body>
  <div class="login-screen">
    <div class="login-card">
      <a href="{{ url_for('index') }}" class="brand"><span class="mark"></span> <span class="brand-name">SKINOLOGY <small>ADMIN</small></span></a>
      <h1>Нэвтрэх</h1>
      {% if error %}<div class="alert error">{{ error }}</div>{% endif %}
      <form method="post">
        <div class="field">
          <label for="password">Нууц үг</label>
          <input type="password" id="password" name="password" autofocus>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">Нэвтрэх</button>
      </form>
    </div>
  </div>
</body>
</html>
